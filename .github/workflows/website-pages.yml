name: Publish Leqana website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leqana-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
